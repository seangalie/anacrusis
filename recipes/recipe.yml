---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: anacrusis
description: An independent atomic KDE desktop based on Fedora Kinoite.

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44

# Track this Fedora release until users explicitly choose a major upgrade.
alt-tags:
  - "44"

platforms:
  - linux/amd64
  - linux/arm64

modules:
  - from-file: modules/multimedia.yml
  - from-file: modules/applications.yml
  - from-file: modules/identity.yml
  - type: signing
