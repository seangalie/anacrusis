---
name: bluebuild
on:
  schedule:
    - cron: "00 06 * * *" # build at 06:00 UTC every day to pick up base image updates
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds

permissions:
  contents: read

# Only one build per ref at a time. A newer push to a pull request supersedes its
# running build, but builds of main are never cancelled: cancelling one between
# pushing the image and signing it would leave an unsigned :44, which breaks
# `rpm-ostree rebase ostree-image-signed:...` for everyone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    # Generous because arm64 is built under emulation. Tighten once real build
    # times are known; the point is to stop a hung build, not a slow one.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # OIDC token for Sigstore signing and attestation
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
