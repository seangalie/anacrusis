---
# Checks the GitHub Actions configuration itself: actionlint catches syntax,
# expression, and type errors (and runs shellcheck over every `run:` script),
# and zizmor catches security problems such as template injection, overly
# broad permissions, and unpinned actions.

name: Lint workflows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/dependabot.yml
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/dependabot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: 🔍 actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Bump both together. The checksum is the linux_amd64 line of
      # https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_checksums.txt
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📦 Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
      - name: 🚀 Run actionlint
        # shellcheck is preinstalled on ubuntu-latest, and actionlint uses it.
        run: '"${RUNNER_TEMP}/actionlint" -color'

  zizmor:
    name: 🌈 zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🚀 Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          # Report as annotations on the run rather than uploading SARIF,
          # which would need code scanning (and, for private repositories,
          # GitHub Code Security) to be enabled.
          advanced-security: false
          annotations: true
