---
# Lints what every repository has from the start: the standalone shell scripts,
# and the .editorconfig rules every text file is expected to follow. The
# workflows themselves are checked by lint-workflows.yml. Add the project's own
# linters here, or in a workflow of their own.

name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its running lint. Runs on main are
# never cancelled, so every commit there keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: 🐚 shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🚀 Run shellcheck
        # shellcheck is preinstalled on ubuntu-latest. actionlint already covers
        # the shell inside workflows, so this checks standalone scripts: any
        # tracked *.sh or *.bash file. A script without either extension needs
        # adding here. xargs -r skips the run when there are none.
        run: |
          set -euo pipefail
          git ls-files -z -- '*.sh' '*.bash' | xargs -0 -r shellcheck

  editorconfig:
    name: 📐 editorconfig-checker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Bump both together. The checksum is the linux-amd64 line of
      # https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${VERSION}/checksums.txt
      EC_VERSION: "4.0.2"
      EC_SHA256: "44efaef3ed14c6ab52eb87481d78e5e5c204796dccf26e2f4598a61ba17f8003"
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📦 Install editorconfig-checker
        run: |
          set -euo pipefail
          archive="editorconfig-checker-linux-amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EC_VERSION}/${archive}"
          echo "${EC_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" editorconfig-checker
      - name: 🚀 Run editorconfig-checker
        # Checks the repository's text files against .editorconfig, skipping
        # binaries and anything .gitignore excludes.
        run: '"${RUNNER_TEMP}/editorconfig-checker"'
